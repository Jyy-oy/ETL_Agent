name: etl-agent

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etl_agent}
      POSTGRES_USER: ${POSTGRES_USER:-etl_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_agent_dev}
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl_agent} -d ${POSTGRES_DB:-etl_agent}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [etl_agent]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [etl_agent]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [etl_agent]

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-etl-agent}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}";
        mc mb --ignore-existing "local/$${MINIO_BUCKET}";
        mc anonymous set none "local/$${MINIO_BUCKET}";
    networks: [etl_agent]

  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add: ["IPC_LOCK"]
    command: ["server", "-dev", "-dev-root-token-id=${VAULT_TOKEN:-dev-only-token}"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-only-token}
      VAULT_ADDR: http://0.0.0.0:8200
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${VAULT_PORT:-8200}:8200"
    volumes:
      - vault_data:/vault/file
    networks: [etl_agent]

  # Optional synthetic source database. Start with the source-target profile.
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.36}
    profiles: ["source-target"]
    restart: unless-stopped
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_0900_ai_ci",
        "--default-time-zone=+00:00",
      ]
    environment:
      MYSQL_DATABASE: ${SOURCE_MYSQL_DATABASE:-etl_demo}
      MYSQL_USER: ${SOURCE_MYSQL_USER:-etl_demo}
      MYSQL_PASSWORD: ${SOURCE_MYSQL_PASSWORD:-etl_demo_dev}
      MYSQL_ROOT_PASSWORD: ${SOURCE_MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [etl_agent]

  # Doris FE/BE must use the same pinned version; this is a single-node test cluster.
  doris-fe:
    image: ${DORIS_FE_IMAGE:-apache/doris:fe-2.1.11}
    profiles: ["source-target"]
    restart: unless-stopped
    hostname: doris-fe
    environment:
      FE_SERVERS: ${DORIS_FE_SERVERS:-fe1:172.30.0.10:9010}
      FE_ID: ${DORIS_FE_ID:-1}
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${DORIS_FE_HTTP_PORT:-8030}:8030"
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${DORIS_FE_QUERY_PORT:-9030}:9030"
    volumes:
      - doris_fe_meta:/opt/apache-doris/fe/doris-meta
      - doris_fe_log:/opt/apache-doris/fe/log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8030/api/bootstrap >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      etl_agent: {}
      doris_net:
        ipv4_address: ${DORIS_FE_IP:-172.30.0.10}

  doris-be:
    image: ${DORIS_BE_IMAGE:-apache/doris:be-2.1.11}
    profiles: ["source-target"]
    restart: unless-stopped
    hostname: doris-be
    depends_on:
      doris-fe:
        condition: service_started
    environment:
      FE_SERVERS: ${DORIS_FE_SERVERS:-fe1:172.30.0.10:9010}
      BE_ADDR: ${DORIS_BE_ADDR:-172.30.0.11:9050}
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${DORIS_BE_HTTP_PORT:-8040}:8040"
    volumes:
      - doris_be_storage:/opt/apache-doris/be/storage
      - doris_be_log:/opt/apache-doris/be/log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8040/api/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      etl_agent: {}
      doris_net:
        ipv4_address: ${DORIS_BE_IP:-172.30.0.11}

  # Optional data-plane service. Start with:
  # docker compose --profile data-plane up -d seatunnel
  seatunnel:
    image: apache/seatunnel:2.3.10
    profiles: ["data-plane"]
    restart: unless-stopped
    environment:
      # SeaTunnel 2.3.10 默认关闭 Hazelcast REST，否则 Zeta HTTP 适配器只能连通但不能调用
      HZ_NETWORK_RESTAPI_ENABLED: ${HZ_NETWORK_RESTAPI_ENABLED:-true}
    command: ["/opt/seatunnel/bin/seatunnel-cluster.sh"]
    ports:
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${SEATUNNEL_PORT:-5801}:5801"
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${SEATUNNEL_HTTP_PORT:-5802}:8080"
      - "${COMPOSE_BIND_IP:-127.0.0.1}:${SEATUNNEL_MEMBER_PORT:-5803}:5803"
    volumes:
      - seatunnel_logs:/opt/seatunnel/logs
      - ./seatunnel/config:/opt/seatunnel/config:ro
    networks:
      etl_agent: {}
      doris_net: {}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  vault_data:
  seatunnel_logs:
  mysql_data:
  doris_fe_meta:
  doris_fe_log:
  doris_be_storage:
  doris_be_log:

networks:
  etl_agent:
    driver: bridge
  doris_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${DORIS_DOCKER_SUBNET:-172.30.0.0/24}
