[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etl-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "boto3>=1.36,<2.0",
    "celery[redis]>=5.4,<6.0",
    "clickhouse-connect>=0.8,<1.0",
    "cryptography>=44,<46",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "hvac>=2.3,<3.0",
    "jsonschema>=4.23,<5.0",
    "langgraph>=0.2.60,<1.0",
    "langgraph-checkpoint-postgres>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "oracledb>=2.5,<3.0",
    "orjson>=3.10,<4.0",
    "polars>=1.20,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "pyhocon>=0.3.61,<1.0",
    "PyJWT>=2.10,<3.0",
    "pymysql>=1.1,<2.0",
    "pyarrow>=19,<24",
    "python-multipart>=0.0.20,<1.0",
    "redis>=5.2,<6.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "structlog>=24.4,<26.0",
    "tenacity>=9,<10",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "respx>=0.22,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/etl_agent"]

[tool.mypy]
ignore_missing_imports = true
